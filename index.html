<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Kushagra Sharan — Data Science & Engineering @ MIT Manipal. NLP systems, ML pipelines, AI internships.">
  <meta property="og:title" content="Kushagra Sharan">
  <meta property="og:description" content="Data Science & Engineering @ MIT Manipal. NLP, ML Systems, AI.">
  <meta property="og:url" content="https://kushagrasharan.me">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Kushagra Sharan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mascot-styles.css">
</head>
<body>
  <div class="focus-pass-overlay" aria-hidden="true"></div>
  <main class="terminal" aria-label="Kushagra Sharan terminal">
    <div id="terminal-output" class="terminal-output" aria-live="polite"></div>

    <form id="terminal-form" class="input-row" autocomplete="off">
      <label for="terminal-input" class="prompt">kushagra@node:~ $</label>
      <span class="input-field">
        <span id="input-mirror" class="input-mirror" aria-hidden="true"></span>
        <span class="cursor" aria-hidden="true"></span>
        <input
          id="terminal-input"
          class="terminal-input"
          name="command"
          type="text"
          spellcheck="false"
          autocapitalize="none"
          autocomplete="off"
          aria-label="Terminal command"
          
        >
      </span>
    </form>
  </main>

  <nav class="mobile-cmds" aria-label="Quick commands">
    <button class="mobile-cmd-btn" data-cmd="about">about</button>
    <button class="mobile-cmd-btn" data-cmd="experience">exp</button>
    <button class="mobile-cmd-btn" data-cmd="projects">projects</button>
    <button class="mobile-cmd-btn" data-cmd="neofetch">neofetch</button>
    <button class="mobile-cmd-btn" data-cmd="contact">contact</button>
  </nav>

  <div id="shortcut-overlay" class="shortcut-overlay" role="dialog" aria-label="Keyboard shortcuts">
    <div class="shortcut-box">
      <div class="shortcut-title">keyboard shortcuts</div>
      <div class="shortcut-row"><span class="shortcut-key">Tab</span><span class="shortcut-desc">autocomplete command</span></div>
      <div class="shortcut-row"><span class="shortcut-key">→</span><span class="shortcut-desc">accept ghost suggestion</span></div>
      <div class="shortcut-row"><span class="shortcut-key">↑ ↓</span><span class="shortcut-desc">command history</span></div>
      <div class="shortcut-row"><span class="shortcut-key">Ctrl+L</span><span class="shortcut-desc">clear screen</span></div>
      <div class="shortcut-row"><span class="shortcut-key">&&</span><span class="shortcut-desc">chain commands</span></div>
      <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">toggle this overlay</span></div>
      <div class="shortcut-close-hint">press ? or Esc to close</div>
    </div>
  </div>

  <div id="system-cursor" class="system-cursor" aria-hidden="true"></div>

  <div id="hud" aria-hidden="true">
    <div class="hud-row">
      <span class="hud-dot"></span>
      <span class="hud-status">node online</span>
    </div>
    <div class="hud-row hud-uptime" id="hud-uptime">00:00:00</div>
    <div class="hud-row hud-focus" id="hud-focus">mechanistic interp</div>
    <div class="hud-row hud-sub" id="hud-sub">open to research collab</div>
  </div>

  <div id="mascot-container">
    <div class="mascot-bubble"></div>
    <svg class="mascot-glyph state-idle" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4L44 24L24 44L4 24L24 4Z" stroke-width="2" fill="var(--bg, #0c0e0f)"/>
      <rect x="20" y="20" width="8" height="8" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <script src="script.js" defer></script>
  <script src="mascot.js" defer></script>
</body>
</html>
