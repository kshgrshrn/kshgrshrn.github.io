<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kushagra Sharan. Personal system interface.">
  <title>Kushagra Sharan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal-shell" aria-label="Personal terminal interface">
    <header class="system-header" aria-label="System identity">
      <div>
        <p class="eyebrow">node</p>
        <h1>Kushagra Sharan</h1>
      </div>
      <div class="status-line" aria-hidden="true">
        <span class="status-dot"></span>
        <span class="node-status">online</span>
      </div>
    </header>

    <section class="terminal" aria-label="Command terminal">
      <div id="terminal-output" class="terminal-output" aria-live="polite"></div>

      <form id="terminal-form" class="input-row" autocomplete="off">
        <label for="terminal-input" class="prompt">ks@node:~$</label>
        <input
          id="terminal-input"
          class="terminal-input"
          name="command"
          type="text"
          spellcheck="false"
          autocapitalize="none"
          autocomplete="off"
          aria-label="Type a command"
        >
      </form>
    </section>

    <nav class="command-index" aria-label="Available commands">
      <button type="button" data-command="help">help</button>
      <button type="button" data-command="about">about</button>
      <button type="button" data-command="projects">projects</button>
      <button type="button" data-command="writing">writing</button>
      <button type="button" data-command="now">now</button>
    </nav>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
